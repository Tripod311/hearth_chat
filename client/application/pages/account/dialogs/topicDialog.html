<div class="w-full h-full pointer-events-auto flex flex-col justify-center items-center absolute top-0 left-0 pointer-events-auto">
	<div class="max-h-[80%] w-[80%] overflow-auto">
		<div data-ref="container" class="flex flex-col gap-2 p-2 max-w-full w-screen-md relative bg-card rounded-xl text-center" style="transition: opacity 0.3s, top 0.3s; top:-20px; opacity:0">
			<div class="p-2 border rounded-xl flex flex-col gap-2">
				<span data-text="title-loc"></span>
				<input data-ref="title" type="text" class="w-full p-2 border border-default bg-white text-black rounded-xl" />
			</div>
			<div class="p-2 border rounded-xl flex flex-col gap-2">
				<span data-text="description-loc"></span>
				<textarea data-ref="description" class="w-full p-2 border border-default bg-white text-black rounded-xl min-h-[300px]"></textarea>
			</div>
			<div class="p-2 border rounded-xl flex flex-col gap-2">
				<span data-text="guest-loc"></span>
				<input data-ref="guest_access" type="checkbox" class="w-[30px] h-[30px]" />
			</div>
			<div class="p-2 border rounded-xl flex flex-col gap-2">
				<span data-text="author-loc"></span>
				<input data-ref="author_write_only" type="checkbox" class="w-[30px] h-[30px]" />
			</div>
			<div class="p-2 border rounded-xl flex flex-col gap-2">
				<span data-text="password-loc"></span>
				<input data-ref="password" type="password" class="w-full p-2 border border-default bg-white text-black rounded-xl" />
			</div>
			<div class="w-full flex flex-row gap-4 justify-center">
				<div class="p-2 rounded bg-hover text-white border-default cursor-pointer border border-strong select-none" data-ref="okButton"></div>
				<div class="p-2 rounded bg-hover text-white border-default cursor-pointer border border-strong select-none" data-ref="cancelButton"></div>
			</div>
		</div>
	</div>
</div>
